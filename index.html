covery (Search, Quick Order and Categories navigation) — Q2 2026",url:"https://ab-inbev.atlassian.net/wiki/spaces/BEESPKM/pages/6245843133/Research+Optimizing+replenishment+to+unlock+buyer+attention+for+discovery+Search+Quick+Order+and+Categories+navigation+Q2+2026"},{year:2026,quarter:2,pov:"pocs",title:"Q2-2026 Loreal: APIary use cases & Analytics requests",url:"https://ab-inbev.atlassian.net/wiki/spaces/BEESPKM/pages/6168412165/Q2-2026+Loreal+APIary+use+cases+Analytics+requests"},{year:2026,quarter:3,pov:"pocs",title:"State of Retailers 2026 study plan",url:"https://ab-inbev.atlassian.net/wiki/spaces/BEESPKM/pages/6443106921/Research+State+of+Retailers+2026+Q3+2026"}],Hs={"job-2021-4-deliver":"First dated packet in the archive: delivery ops, not the beyond-order bets of the quarter.","job-2022-1-deliver":"POCs need live inventory, OnTime tracking, and a way to pay — Club B is not in the field yet.","job-2022-2-deliver":"Delivery convenience and inventory visibility are the trust surface while homepage is the stated bet.","job-2022-2-homepage":"POCs skip the homepage and go straight to storefronts — undercuts homepage-as-growth-surface.","job-2022-2-rewards":"Markets still need admin to run Rewards; the POC-facing loop is not proven.","platform-2022-2-marketplace":"Zone BR starts asking whether BEES can be a marketplace — ahead of the homepage/rewards bet.","pocs-2022-2-link":"Key-account journeys appear: the “retailer” is no longer only a small off-trade POC.","job-2022-3-deliver":"ATP / inventory control is what ops can promise; engagement experiments sit on top of that.","job-2022-3-fintech":"Returned-order credit and QR pay show up while the quarter’s bet is still gamification.","job-2022-3-link":"EDI, multi-POC ordering, and KAM finance — Link is running a different job than Club B.","job-2022-3-postorder":"Express delivery is tested as a reason to choose BEES over waiting for the next visit.","platform-2022-3-ads":"Ads Manager feedback: partners want to buy media on BEES before the app has a marketplace habit.","platform-2022-3-marketplace":"Marketplace exploratory continues — still not the official product bet this quarter.","competition-2022-4-force":"Force GPS/efficiency: the BDR channel is instrumented while BEES tries discoverability.","job-2022-4-customer":"Feature ranking: POCs still put commercial basics above engagement experiments.","job-2022-4-link":"Pre-order, sell-out data, and onboarding automation — Link scales ops, not partner browse.","job-2022-4-rewards":"Mi Negocio competition mode and redemption lists test “beyond order” as discoverability launches.","platform-2022-4-marketplace":"First explicit test: can POCs find partner SKUs on the same app? Replenishment vs discovery starts here.","pocs-2022-4-link":"South Africa field visit: Link KA reality is local, not a copy of LATAM off-trade.","competition-2023-1-marketplace":"First competitive map of B2B apps — naming 1P/3P/DTaaS has to beat a field that already exists.","job-2023-1-fintech":"Wallet, Vendo, cash deposit: POCs want money tools, not only a catalog — models are named this quarter.","job-2023-1-one":"Partners cannot run BEES as a channel until insights in One are understandable.","job-2023-1-rewards":"Challenge flow / BRF: missions only work if progress is visible — still a 1P retention layer.","platform-2023-1-marketplace":"1P, 3P Same Store, DTaaS, DaaS named. PepsiCo discovery: start 1P before scaling partners.","platform-2023-1-one":"1P partner portal and 3P Pro insights: the platform bet is also an admin-UX bet.","pocs-2023-1-fintech":"Vendo POC journey: recharges are a separate retailer job from beer replenishment.","pocs-2023-1-link":"KAM journey: key accounts do not shop like traditional-trade POCs.","competition-2023-2-fintech":"Fintech competitors already own credit and payouts — BEES is late to the money job.","job-2023-2-deliver":"Autoblock and availability risk: promising inventory you cannot deliver breaks the Partner GTM story.","job-2023-2-fintech":"Wallet pt. 2 and remittances: money-out jobs sit beside ShopX awareness, not inside it.","job-2023-2-link":"Last-mile tracking and notification center: post-order trust is the KAM equivalent of “best deal.”","platform-2023-2-marketplace":"ShopX awareness + HEXA: teach POCs other sellers exist — collections tests show comprehension is the gap.","pocs-2023-2-link":"Modern trade on BEES: a different retailer universe than traditional POC ethnography.","pocs-2023-2-marketplace":"Mexico visit: marketplace GTM has to fit how POCs already buy, not how BEES wants to sell.","pocs-2023-2-strategy":"Ordering simulation: the replenishment job is already the default — Partner GTM is extra work.","job-2023-3-catalog":"OOS on browse: assortment expansion is worthless if the shelf in the app is empty.","job-2023-3-deliver":"LOAT V2: reps still need a faster order-taking path than the POC app.","job-2023-3-fintech":"Colombian store owners manage money outside BEES — credit is the missing platform piece.","job-2023-3-link":"Price discrepancies, SKU status, future tracking: KAM pain is commercial truth, not discovery UI.","job-2023-3-rewards":"POCs want solutions that make life as business owners easier — not another points mechanic.","platform-2023-3-marketplace":"POCs ask why ordering is changing and fear losing the BDR — DTaaS mutates the product, not just SKUs.","pocs-2023-3-deliver":"Delivery-admin profiles: who we serve in ops is not the same POC the Customer app was built for.","pocs-2023-3-fintech":"Ecuador ethnography: cash, credit, and trust sit before any marketplace assortment story.","pocs-2023-3-marketplace":"If POCs see BEES as the best deal they will order here — Gloria, Nestlé, MercaSid test that claim.","competition-2023-4-marketplace":"PepsiCo VanSales: the competitor is a sales-app plus rep, not another marketplace.","job-2023-4-deliver":"LOAT literature: order-taking research is still the spine while pharma and algo selling get the headline.","job-2023-4-fintech":"Pay-by-balance: credit as a checkout method — closer to “business platform” than algo cards.","job-2023-4-link":"Post-order info center: KAMs cannot run the account if status is scattered.","job-2023-4-rewards":"Algo selling discovery: personalize replenishment — Mi Negocio still rides along, not the core job.","platform-2023-4-marketplace":"Discovery project continues: models are named; partner GTM is still being invented.","pocs-2023-4-link":"Link user profiles: more than one “retailer” inside the same POC.","pocs-2023-4-marketplace":"L'Oréal / pharma POCs open a different RTM — DTaaS problems from Gloria/Nestlé still apply.","job-2024-1-cart":"Cart abandonment and truck overview: the leak is at checkout, while the quarter’s bet is credit-as-product.","job-2024-1-link":"EDI discovery and info-center eval: KAMs need order planning, not a Finance Page.","job-2024-1-postorder":"Orders vs invoices are disconnected — credit as a hub fails if post-sales is a scavenger hunt.","job-2024-1-rewards":"Algo cards, deals, redemption: commercial layer is still points-shaped while Finance Page is the strategy.","competition-2024-2-strategy":"Pharma competitive set: BEES is one app among specialist RTMs, not the default.","job-2024-2-link":"3P best order and manager view: Link has to pick a seller — multi-seller UX is not only Customer.","job-2024-2-rewards":"My Progress / missions: rewards still try to create habit while shop-by-brand is the product bet.","platform-2024-2-marketplace":"Shop-by-brand, distributor storefronts, PLP price compare — the multi-seller product finally has a UI.","pocs-2024-1-marketplace":"Nestlé Ecuador wholesalers: DTaaS has to fit an existing wholesale layer, not replace it.","pocs-2024-1-strategy":"L'Oréal evaluative + pharma ecosystem: credit-as-product must work for a different RTM than beer.","pocs-2024-2-link":"Small-format Link: not every POC can carry the full KA toolset.","pocs-2024-2-strategy":"Global POC segmentation plus partner desks (Bimbo, K-C, GM, Mondelez): “the retailer” splinters.","competition-2024-3-force":"ION, Force, M360, MyBuddy: order-taking competitors are sales apps, not marketplaces.","job-2024-3-cart":"Multi-dropdown and terms-by-category: 3P checkout complexity is the ops constraint, not discovery.","job-2024-3-customer":"US large-order sizes: the POC job does not scale linearly with basket — ops before more SKUs.","job-2024-3-link":"Canada / EDI fieldwork: mature markets already have a replenishment system; 3P homepage is extra.","job-2024-3-postorder":"Order edit and status issues: Flex language fails if POCs cannot change or trust the order.","job-2024-3-rewards":"Replenishment perception, tiering enrollment, badges — still engagement while 3P Core says ops first.","platform-2024-3-marketplace":"~44% fulfillment on 3P Core. Scale is constrained by ops and data quality, not discovery UI.","platform-2024-3-postorder":"Product exchange: the trust loop starts when the order is wrong, not when the SKU is found.","platform-2024-3-strategy":"Emotional perception of BEES: ops failures become brand — “best place to buy” is a feeling.","pocs-2024-3-customer":"ASEAN traditional trade: multi-app, price-led POCs — BEES is one more catalog.","pocs-2024-3-strategy":"Pharma multiple price tables: the same POC sees different commercial truth by channel.","competition-2024-4-cart":"Purchase-management benchmarking: competitors already give a command center; BEES is catching up.","competition-2024-4-strategy":"SEA default is multi-app. Trust-loop features compete with WhatsApp and the next catalog.","job-2024-4-cart":"Cart nudges and savings work at high intent — the trust loop includes money left on the table.","job-2024-4-fintech":"Peru credit discovery + admin portal: Finance Page still has to work across vendors, not only ABI.","job-2024-4-link":"Curatorship and prospection toolkit: KAM trust is built before the order, not only in returns.","job-2024-4-rewards":"CSUS replenishment/search and black-points multiplier: rewards try to pull attention back to reorder.","platform-2024-4-catalog":"PLP density: commercial truth has to fit the scan, not a homepage banner.","platform-2024-4-marketplace":"Seller ranking (Justice League): who to trust when last-mile and 3P sellers share the same order.","platform-2024-4-postorder":"Returns and exchanges are the trust loop — ranking sellers without this is theater.","pocs-2024-4-link":"VMI desirability for key accounts: large POCs want the system to replenish, not another catalog.","job-2025-1-customer":"Comms workshop: POCs are flooded; identity/merge work fails if messages are noise.","job-2025-1-deliver":"Inventory autonomy for fulfillment: large-POC orders break when ops cannot split truth from the app.","job-2025-1-fintech":"Finance Page: credit, balance, and upcoming payments in one view — ~30% still look under Orders.","job-2025-1-link":"Order split / multiple deliveries: large POCs cannot live with one drop for a complex order.","job-2025-1-postorder":"Truck, delivery types, driver chat, exchanges — post-order is the large-POC job, not the homepage.","job-2025-1-rewards":"Offers Hub and points+cash while identity is broken: rewards cannot land on duplicate accounts.","platform-2025-1-ads":"DR/PE ads pilots: in-journey placements beat banners — monetize after identity works.","pocs-2025-1-customer":"~28% of BR accounts are duplicates. Merge is the identity bet hiding under “large POC.”","pocs-2025-1-strategy":"Large POCs: 2× order time, broken upload; BDRs still smoother than BEES for Heineken and others.","job-2025-2-catalog":"PLP density again: replenishment-first means the list has to scan, not decorate.","job-2025-2-customer":"Notification preferences split by channel — push fatigue vs email vs WhatsApp for order issues.","job-2025-2-fintech":"Credit terms per SKU: commercial truth at the line, not a single POC-level limit.","job-2025-2-homepage":"Homepage modules are seen but not understood; storefronts still win. Matches replenishment-first.","job-2025-2-one":"Analytics adoption: partners will not run BEES as a channel if One is not their cockpit.","job-2025-2-rewards":"Gamification and pay-with-points while strategy says win replenishment first — tension, not support.","platform-2025-2-ads":"BR ads pilot: sponsored listings at intent (PLP) outperform homepage banners.","pocs-2025-2-link":"Small-format Link for large POCs: the KA tool has to shrink to the actual buyer.","pocs-2025-2-strategy":"Vietnam: reps win on trust, price, promo transparency. Shopping lists do not replace that.","competition-2025-3-strategy":"Heishop / Juntos+: commercial conditions are table stakes; BEES is measured against those apps.","job-2025-3-deliver":"Fulfillment-center research: “best place to buy” dies in the DC, not on the Offers Hub.","job-2025-3-fintech":"Pay credit fees with points: rewards only matter when they touch the credit job.","job-2025-3-homepage":"Agnostic homepage concepts score low; POCs want categories, suggested order, partner stores.","job-2025-3-link":"Back-in-stock, OOS swap, trade management: commercial conditions for KAMs are operational.","job-2025-3-one":"Distributor experience in One: partners cannot sell commercial conditions they cannot see.","job-2025-3-rewards":"Club B doesn't change my behavior. Credit does. — challenges the quarter’s rewards-heavy bet.","pocs-2025-3-customer":"Add-vendor / link-your-business: BDRs still create links without POC control; trust starts at signup.","pocs-2025-3-link":"Febrafar and pharma OL journeys: key-account logistics is a different retailer universe.","pocs-2025-3-strategy":"Botswana & Mozambique: expansion markets have not earned the commercial-conditions story yet.","job-2025-4-customer":"Assistant unseen (13/15); OTP wins on success (~95%) but password is still the mental model.","job-2025-4-deliver":"DDC management: assisted/AI bets sit on ops that still need a human in the warehouse.","job- o DTaaS discovery.",confidence:"solid",sources:[q.bizModels,q.competitive2023]},{year:2023,quarter:2,label:"Partner GTM",strategy:"ShopX / marketplace awareness: teach POCs that other sellers exist on BEES.",research:"Mexico market visit; marketplace awareness studies.",confidence:"solid",sources:[q.bizModels]},{year:2023,quarter:3,label:"Multi-seller ethnography",strategy:"Platform bet: Nestlé, Gloria, MercaSid on DTaaS. Strategy says expand assortment; research asks if POCs want it.",research:"126-POC ethnography: buy on best deal; want credit, returns, inventory — a business platform, not an order-only app.",confidence:"solid",sources:[q.marketplaceOverall,q.bizModels]},{year:2023,quarter:4,label:"Pharma + algo selling",strategy:"L'Oréal / pharma as a distinct RTM. Algo selling to personalize replenishment.",research:"Pharma DTaaS discovery; algo selling generative research.",confidence:"solid",sources:[q.customerReports]},{year:2024,quarter:1,label:"Credit as product",strategy:"Finance Page: credit, balance, payment as a hub. Financial Services strategy: local payments + credit terms as ecosystem products.",research:"Finance Page research (PE/BR). Pharma ecosystem mapping.",confidence:"solid",sources:[q.customerReports,q.customerStrategy]},{year:2024,quarter:2,label:"Multi-seller UX",strategy:"Shop-by-brand, distributor storefronts, PLP price compare. Ads at intent (PLP), not homepage banners.",research:"Multiple entry points; BEES Ads pilots later confirm in-journey > banner.",confidence:"solid",sources:[q.customerStrategy,q.customerReports]},{year:2024,quarter:3,label:"Ops before SKUs",strategy:"3P Core: scale is constrained by fulfillment, credit segmentation, and data quality — not by discovery UI. Asia expansion.",research:"~44% fulfillment on 3P Core. Delivery “Flex” language fails. SEA: multi-app, price-led.",confidence:"solid",sources:[q.core3p,q.marketplaceRtW]},{year:2024,quarter:4,label:"Trust loop",strategy:"Returns/exchanges, seller ranking, purchas
